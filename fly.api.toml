# Fly.io config for dig-api (Fastify REST API)
# Deploy: fly deploy --config fly.api.toml

app = "dig-api"
# Co-located with dig-db-scene (lhr). When the API ran in iad every query
# crossed the Atlantic: /v1/health (no DB) 0.20s vs /v1/scenes/:slug 0.68s.
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  # MUST stay "off" while dig-web reaches this app over Fly private
  # networking (dig-api.internal). Private .internal traffic bypasses the Fly
  # proxy, so it does NOT wake stopped or suspended machines — .internal DNS
  # still returns their IPs, the connection hangs, and the caller eats
  # digFetch's 12s timeout + retry. That is what made label pages take
  # 26-90s. Set by 0cf1747; regressed to "stop" by cb04c88 and to "suspend"
  # by 872eb59. Do not re-enable auto-stop without first moving dig-web back
  # to the public https://dig-api.fly.dev URL.
  auto_stop_machines = "off"
  auto_start_machines = true
  # Two machines, matching dig-web. dig-api ran a single machine until
  # 2026-08-08, which made it the last single point of failure in the stack:
  # every dig-web page fans out to it, so a wedge here breaks every artist,
  # label and master page while dig-web's deliberately-shallow /api/health
  # keeps reporting ok. A second 512MB machine is $3.32/mo.
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/v1/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
