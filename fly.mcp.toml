# Fly.io config for dig-mcp (MCP SSE server)
# Deploy: fly deploy --config fly.mcp.toml

app = "dig-mcp"
# Co-located with dig-db-scene (lhr), same as dig-api and dig-web.
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  MCP_ANON_PER_MIN = "60"
  MCP_ANON_PER_DAY = "500"
  MCP_SPEND_PCT = "0"
  MCP_BETA_CAPACITY_MODE = "off"

[processes]
  # "serve" (tsx), not "dev" (tsx watch) — no filesystem watcher in production.
  app = "pnpm --filter @dig/mcp serve"

[[services]]
  protocol = "tcp"
  internal_port = 3001
  processes = ["app"]
  # MCP SSE requires sticky sessions — single machine for now.
  # When idle, allow the lone machine to stop completely. This previously
  # read "off" / min 1, which contradicted the comment and billed 24/7.
  # Safe to stop here (unlike dig-api) because clients reach this app over
  # its public hostname, so the Fly proxy wakes the machine on connect.
  # TODO: Add Fly-Force-Instance-Id header support for multi-machine.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
