name: Regression Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"  # Daily at 7:30am UTC

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run production regression smoke
        env:
          API_URL: https://dig-api.fly.dev
          WEB_URL: https://app.dig.baby
          MCP_URL: https://dig-mcp.fly.dev
        run: npm run smoke:regression

  no-dead-ends:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No-dead-ends canary
        run: npx tsx scripts/no-dead-ends-check.ts
        env:
          BASE_URL: https://app.dig.baby

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-dead-ends-report
          path: no-dead-ends-report.json
