name: Regression Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"  # Daily at 7:30am UTC

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run after no-dead-ends so the two jobs don't compete for DB connections.
    # no-dead-ends fetches 100 entity pages (5 concurrent), each triggering
    # multiple API→DB calls. Running smoke in parallel exhausts the pool.
    needs: [no-dead-ends]
    # Always run smoke — it's an independent API health check.
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run production regression smoke
        env:
          API_URL: https://dig-api.fly.dev
          WEB_URL: https://app.dig.baby
        run: npm run smoke:regression

  route-404-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Route 404 sweep
        run: npm run sweep:404
        env:
          API_URL: https://dig-api.fly.dev
          WEB_URL: https://app.dig.baby

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-404-report
          path: route-404-report.json

  no-dead-ends:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No-dead-ends canary
        run: npx tsx scripts/no-dead-ends-check.ts
        env:
          BASE_URL: https://app.dig.baby

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-dead-ends-report
          path: no-dead-ends-report.json
