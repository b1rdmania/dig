name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dig
          POSTGRES_PASSWORD: dig_local
          POSTGRES_DB: dig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dig"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dig:dig_local@localhost:5432/dig
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migration parity audit
        run: npm run audit:migrations

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm --filter @dig/db migrate:up

      - name: Test
        run: pnpm test
