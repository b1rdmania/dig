# Fly.io config for dig-web (Next.js frontend)
# Deploy: fly deploy --config fly.web.toml --remote-only

app = "dig-web"
# Follows dig-api and dig-db-scene into lhr. Moving the API alone would only
# relocate the transatlantic hop from api->db to web->api.
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.web"

[deploy]
  strategy = "rolling"

[env]
  PORT = "3002"
  NODE_ENV = "production"
  # Public URL, not dig-api.internal. The Fly proxy wakes stopped/suspended
  # API machines; private .internal networking does not, so a request that
  # lands on an idle machine hangs until digFetch times out. The ~200ms
  # proxy hop is far cheaper than a 12s timeout + retry. Both apps now run
  # in lhr, so this stays a same-region round-trip.
  DIG_API_URL = "https://dig-api.fly.dev"

[http_service]
  internal_port = 3002
  force_https = true
  # Keep one machine warm. With min 0 the first hit after idle measured
  # 10.9s (vs 1.3s warm) while the VM booted and Next.js cold-started.
  # Spillover machines may still stop; the pinned one carries idle traffic.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 120
    soft_limit = 90

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
