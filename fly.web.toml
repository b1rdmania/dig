# Fly.io config for dig-web (Next.js frontend)
# Deploy: fly deploy --config fly.web.toml --remote-only

app = "dig-web"
# Follows dig-api and dig-db-scene into lhr. Moving the API alone would only
# relocate the transatlantic hop from api->db to web->api.
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.web"

[deploy]
  strategy = "rolling"

[env]
  PORT = "3002"
  NODE_ENV = "production"
  # Public URL, not dig-api.internal. The Fly proxy wakes stopped/suspended
  # API machines; private .internal networking does not, so a request that
  # lands on an idle machine hangs until digFetch times out. The ~200ms
  # proxy hop is far cheaper than a 12s timeout + retry. Both apps now run
  # in lhr, so this stays a same-region round-trip.
  DIG_API_URL = "https://dig-api.fly.dev"

[http_service]
  internal_port = 3002
  force_https = true
  # Keep two machines warm. With min 0 the first hit after idle measured
  # 10.9s (vs 1.3s warm) while the VM booted and Next.js cold-started.
  # Two, not one: on 2026-08-07 the single machine wedged (shallow
  # /api/health timing out at 5s while digFetch calls to dig-api threw
  # ECONNRESET), the check went critical, and the proxy had nothing left to
  # route to — PR01, four hours of full outage. With a second machine the
  # proxy sheds the wedged one and the site stays up.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    # 120 was not capacity, it was a queue that melted. Each concurrent SSR
    # render fans out several fetches to dig-api on ONE shared vCPU; at 120 the
    # machine ran out of outbound sockets (ECONNRESET on TLS establish) and had
    # no event loop left to answer a static /api/health inside its 5s budget,
    # so Fly pulled it from the proxy. Twice, on 08-07 and 08-08.
    # Lower limits push the queue up to the Fly proxy, where waiting is cheap
    # and doesn't take the machine down with it.
    hard_limit = 40
    soft_limit = 25

# Liveness probe. Without this Fly cannot tell a wedged Next.js process from a
# healthy one — the process stays alive, the port stays open, and traffic keeps
# being routed to a machine that answers nothing. /api/health is deliberately
# shallow (no dig-api or DB call) so an API outage cannot cascade into Fly
# restarting healthy web machines.
[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # 2GB, not 1GB: the 1GB machine was OOM-killed (exit 137) on 2026-08-05
  # under catalog crawler traffic.
  memory = "2048mb"
