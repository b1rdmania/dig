# Fly.io config for dig-web (Next.js frontend)
# Deploy: fly deploy --config fly.web.toml --remote-only

app = "dig-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.web"

[deploy]
  strategy = "rolling"

[env]
  PORT = "3002"
  NODE_ENV = "production"
  # Internal Fly networking — ~1ms to API instead of internet round-trip
  DIG_API_URL = "http://dig-api.internal:3000"

[http_service]
  internal_port = 3002
  force_https = true
  # Idle cost optimisation: let the lone web machine stop when there's no
  # traffic and wake on demand. First hit after an idle period takes ~3-5s
  # while the VM boots and Next.js cold-starts. Acceptable for soft alpha.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 120
    soft_limit = 90

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
